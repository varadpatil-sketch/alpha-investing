services:
  - type: web
    name: alpha-investing-backend
    env: node
    region: singapore # or oregon / frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard or prompt during blueprint setup
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
